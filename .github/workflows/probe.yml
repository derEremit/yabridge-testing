name: Probe Build and Tests

on:
  push:
    branches: [master]
    paths:
      - 'probe/**'
      - 'test-harness/tests/test_probe_artifact.py'
      - 'test-harness/tests/test_probe_host.py'
      - 'test-harness/tests/test_probe_transport.py'
      - '.github/workflows/probe.yml'
  pull_request:
    branches: [master]
    paths:
      - 'probe/**'
      - 'test-harness/tests/test_probe_artifact.py'
      - 'test-harness/tests/test_probe_host.py'
      - 'test-harness/tests/test_probe_transport.py'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    name: Build and verify probe artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            libx11-dev \
            libxtst-dev \
            xvfb \
            xdotool

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: '3.12'

      - name: Install test harness
        run: |
          cd test-harness
          pip install -e ".[dev]"

      - name: Build native and MinGW probe artifacts
        run: |
          meson setup probe/build-native probe
          meson setup --cross-file probe/cross/mingw-w64-x86_64.ini probe/build-win probe
          meson compile -C probe/build-native
          meson compile -C probe/build-win

      - name: Verify CLAP revision and artifact reproducibility
        run: |
          cd test-harness
          python -m pytest -q tests/test_probe_artifact.py

      - name: Run native host and transport tests under Xvfb
        run: |
          cd test-harness
          xvfb-run -a python -m pytest -q -m native_probe tests/test_probe_host.py
          python -m pytest -q tests/test_probe_transport.py

      - name: Write SHA-256 manifest
        run: |
          cd probe
          {
            sha256sum build-native/clap-probe-host
            sha256sum build-native/native-clap-fixture.so
            sha256sum build-win/coordprobe.clap-win
            sha256sum build-win/coordprobe-selftest.exe
          } | tee build-manifest.sha256

      - name: Upload probe artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # tag: v4
        with:
          name: probe-artifacts
          path: |
            probe/build-native/clap-probe-host
            probe/build-native/native-clap-fixture.so
            probe/build-win/coordprobe.clap-win
            probe/build-win/coordprobe-selftest.exe
            probe/build-manifest.sha256
          retention-days: 7
