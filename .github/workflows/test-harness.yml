name: Test Harness

on:
  push:
    branches: [main]
    paths:
      - 'test-harness/**'
      - '.github/workflows/test-harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'test-harness/**'
      - '.github/workflows/test-harness.yml'

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # tag: v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test harness
        run: |
          cd test-harness
          pip install -e ".[dev]"

      - name: Run pure harness tests
        run: |
          cd test-harness
          python -m pytest -q -m "not native_probe and not wine_probe and not live_probe"

      - name: Type check
        run: |
          cd test-harness
          python -m mypy src/

      - name: Lint
        run: |
          cd test-harness
          python -m ruff check src/ tests/
