---
all:
  children:
    vms:
      hosts:
        ubuntu-gnome:
          ansible_host: 192.168.122.10
          ansible_user: yabridge
          distro: ubuntu
          desktop: gnome
        arch-kde:
          ansible_host: 192.168.122.11
          ansible_user: yabridge
          distro: arch
          desktop: kde

    # For testing on local machine
    local:
      hosts:
        localhost:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    # Wine configuration
    wine_version: "10.13"
    wine_staging: false
    wine_patches: []

    # Yabridge configuration
    yabridge_version: "5.1.1"
    yabridge_branch: "new-wine10-embedding"
    yabridge_build_from_source: true

    # Test plugin paths
    plugin_install_dir: "/opt/test-plugins"
    yabridge_install_dir: "/opt/yabridge"
